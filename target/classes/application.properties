# Netflix Complete System Configuration

# Database Configuration
# In dev we allow public key retrieval for MySQL 8+ when using caching_sha2 authentication.
# For production prefer configuring SSL (sslMode=REQUIRED) instead of relying on allowPublicKeyRetrieval.
spring.datasource.url=jdbc:mysql://localhost:3306/netflix_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=asdfghjkl
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Server Configuration
server.port=8082

# CORS Configuration for Frontend Integration
spring.web.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Logging Configuration
logging.level.com.netflix=DEBUG
logging.level.org.springframework.jdbc=DEBUG

# JSON Configuration  
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata

# Admin Authentication (move to database in production)
netflix.admin.username=admin
netflix.admin.password=admin123